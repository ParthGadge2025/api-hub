services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  server:
    build: ./server
    env_file: ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/api-hub
      CLIENT_URL: http://localhost:8080
    depends_on: [mongo]
  client:
    build: ./client
    ports: ["8080:80"]
    depends_on: [server]
volumes:
  mongo-data:
